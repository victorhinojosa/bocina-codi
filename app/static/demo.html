<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<title>Bocina CoDi · demo</title>
<style>
  :root { --pey: #0067f1; --ink: #e6ebf5; --muted: #a9b3c5; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); background: radial-gradient(1200px 700px at 30% 15%, #1d2a44, #0d1220); display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 32px 6px; flex-shrink: 0; }
  header img { height: 30px; background: #fff; padding: 7px 11px; border-radius: 11px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  header .sp { flex: 1; }
  .sim { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 14px; border-radius: 12px; cursor: pointer; }
  .sim:hover { background: rgba(255,255,255,.12); }
  main { flex: 1; min-height: 0; display: flex; gap: 28px; padding: 14px 32px 26px; align-items: stretch; }
  .panel { display: flex; flex-direction: column; min-height: 0; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 4px; display: flex; gap: 8px; align-items: center; }
  .label b { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; font-size: 12px; letter-spacing: 0; }
  .counter { flex: 1; min-width: 0; }
  .counter .frame { flex: 1; min-height: 0; border-radius: 26px; overflow: hidden; background: #f5f7fb; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .phone-col { flex-shrink: 0; align-items: center; }
  .phone { height: min(844px, calc(100vh - 150px)); aspect-ratio: 390 / 844; flex: none; background: #0b0d12; border-radius: 52px; padding: 11px;
    box-shadow: 0 0 0 2px #39404f, 0 30px 80px rgba(0,0,0,.5); position: relative; }
  .phone .island { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 96px; height: 28px; background: #0b0d12; border-radius: 18px; z-index: 2; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #f5f7fb; }
  .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; background: #f5f7fb; }
  /* La app se dibuja a tamaño de celular real (390×844) y se escala para que se vea igual en cualquier pantalla */
  .screen iframe { position: absolute; top: 0; left: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  .flow { align-self: center; color: var(--muted); font-size: 13px; text-align: center; max-width: 120px; line-height: 1.4; }
  .flow svg { width: 44px; height: 44px; stroke: var(--pey); fill: none; stroke-width: 1.8; display: block; margin: 0 auto 6px; }
  @media (max-width: 980px) {
    body { overflow: auto; }
    main { flex-direction: column; }
    .counter .frame { height: 80vh; flex: none; }
    .phone { height: 80vh; flex: none; }
    .flow { display: none; }
  }
</style>
</head>
<body>
  <header>
    <img src="/static/pey-codi.svg" alt="pey · CoDi" />
    <div>
      <h1>Bocina CoDi</h1>
      <p>Escanea el QR de la bocina con la app de tu banco (CoDi) y paga cualquier monto: la bocina lo anuncia y el dueño lo ve en su celular.</p>
    </div>
    <span class="sp"></span>
    <button class="sim" id="sim" hidden>Simular un pago</button>
  </header>
  <main>
    <section class="panel counter">
      <div class="label"><b>1</b>En el mostrador</div>
      <div class="frame"><iframe src="/?embed=1" title="Bocina en el mostrador" allow="autoplay"></iframe></div>
    </section>
    <div class="flow" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></svg>
      Mismo pago, verificado por pey
    </div>
    <section class="panel phone-col">
      <div class="label"><b>2</b>En el celular del dueño</div>
      <div class="phone"><div class="island"></div><div class="screen" id="screen"><iframe id="appFrame" src="/app?embed=1" title="App del dueño" allow="microphone; clipboard-write"></iframe></div></div>
    </section>
  </main>
<script>
  const fit = () => { const w = document.getElementById("screen").clientWidth; document.getElementById("appFrame").style.transform = `scale(${w / 390})`; };
  addEventListener("resize", fit); fit(); new ResizeObserver(fit).observe(document.getElementById("screen"));

  // Botón de simulación solo si el servidor la permite y no pide PIN (útil para probar sin CoDi)
  (async () => {
    try {
      const st = await (await fetch("/api/status")).json();
      if (!st.allowSimulation || st.pinRequired) return;
      const fx = (await (await fetch("/api/fixed-qr")).json()).fixed;
      if (!fx) return;
      const b = document.getElementById("sim");
      b.hidden = false;
      b.onclick = async () => {
        b.disabled = true;
        try { await fetch(`/api/dev/simulate/${fx.id}`, { method: "POST" }); } finally { setTimeout(() => (b.disabled = false), 1500); }
      };
    } catch {}
  })();
</script>
</body>
</html>
