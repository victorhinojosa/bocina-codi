<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="/static/tokens.css" />
<title>Din · demo</title>
<style>
  /* Colores y tipografía: tokens.css (marca Din). Fondo oscuro: texto en on-brand / brand-tint. */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--on-brand); font-family: var(--font-sans); background: radial-gradient(1200px 700px at 30% 15%, var(--brand-pressed), var(--ink)); display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 32px 6px; flex-shrink: 0; }
  .din { display: inline-flex; align-items: center; gap: 8px; font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -.5px; color: var(--on-brand); flex-shrink: 0; }
  .din img { width: 30px; height: 30px; display: block; }
  footer { display: flex; justify-content: center; padding: 0 0 12px; flex-shrink: 0; }
  footer img { height: 14px; display: block; background: var(--surface); padding: 3px 7px; box-sizing: content-box; border-radius: var(--radius-sm); }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  header p { margin: 2px 0 0; color: var(--brand-tint); opacity: .8; font-size: 14px; }
  header .sp { flex: 1; }
  .sim { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--on-brand); font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 16px; border-radius: var(--radius-full); cursor: pointer; }
  .sim:hover { background: rgba(255,255,255,.12); }
  main { flex: 1; min-height: 0; display: flex; gap: 28px; padding: 14px 32px 26px; align-items: stretch; }
  .panel { display: flex; flex-direction: column; min-height: 0; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-tint); opacity: .8; margin: 0 0 10px 4px; display: flex; gap: 8px; align-items: center; }
  .label b { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.1); color: var(--on-brand); display: grid; place-items: center; font-size: 12px; letter-spacing: 0; }
  .counter { flex: 1; min-width: 0; }
  .counter .frame { flex: 1; min-height: 0; border-radius: var(--radius-xl); overflow: hidden; background: var(--bg); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .phone-col { flex-shrink: 0; align-items: center; }
  .phone { height: min(844px, calc(100vh - 150px)); aspect-ratio: 390 / 844; flex: none; background: var(--ink); border-radius: 52px; padding: 11px;
    box-shadow: 0 0 0 2px var(--ink-muted), 0 30px 80px rgba(0,0,0,.5); position: relative; }
  .phone .island { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 96px; height: 28px; background: var(--ink); border-radius: 18px; z-index: 2; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; background: var(--bg); }
  /* La app se dibuja a tamaño de celular real (390×844) y se escala para que se vea igual en cualquier pantalla */
  .screen iframe { position: absolute; top: 0; left: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  .flow { align-self: center; color: var(--brand-tint); opacity: .8; font-size: 13px; text-align: center; max-width: 120px; line-height: 1.4; }
  .flow svg { width: 44px; height: 44px; stroke: var(--live); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 6px; }
  @media (max-width: 980px) {
    body { overflow: auto; }
    main { flex-direction: column; }
    .counter .frame { height: 80vh; flex: none; }
    .phone { height: 80vh; flex: none; }
    .flow { display: none; }
  }
</style>
</head>
<body>
  <header>
    <span class="din"><img src="/static/logo-din-white.svg" alt="" />Din</span>
    <div>
      <h1>Bocina CoDi</h1>
      <p>Escanea el QR de la bocina con la app de tu banco (CoDi) y paga cualquier monto: la bocina lo anuncia y el dueño lo ve en su celular.</p>
    </div>
    <span class="sp"></span>
    <button class="sim" id="sim" hidden>Simular un pago</button>
  </header>
  <main>
    <section class="panel counter">
      <div class="label"><b>1</b>En el mostrador</div>
      <div class="frame"><iframe id="spkFrame" src="/bocina?embed=1" title="Bocina en el mostrador" allow="autoplay"></iframe></div>
    </section>
    <div class="flow" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      Mismo pago, verificado por pey
    </div>
    <section class="panel phone-col">
      <div class="label"><b>2</b>En el celular del dueño</div>
      <div class="phone"><div class="island"></div><div class="screen" id="screen"><iframe id="appFrame" src="/app?embed=1" title="App del dueño" allow="microphone; clipboard-write"></iframe></div></div>
    </section>
  </main>
  <footer><img src="/static/pey-codi.svg" alt="pey × CoDi" /></footer>
<script>
  const fit = () => { const w = document.getElementById("screen").clientWidth; document.getElementById("appFrame").style.transform = `scale(${w / 390})`; };
  addEventListener("resize", fit); fit(); new ResizeObserver(fit).observe(document.getElementById("screen"));

  // Cuando alguien entra en la App de la derecha, la bocina de la izquierda (misma sesión) carga su QR
  addEventListener("message", (e) => {
    if (e.origin === location.origin && e.data === "din:login") document.getElementById("spkFrame").src = "/bocina?embed=1";
  });

  // Botón de simulación solo si el servidor la permite y hay sesión (útil para probar sin CoDi)
  (async () => {
    try {
      const st = await (await fetch("/api/status")).json();
      if (!st.allowSimulation) return;
      const r = await fetch("/api/fixed-qr");
      if (!r.ok) return;
      const fx = (await r.json()).fixed;
      if (!fx) return;
      const b = document.getElementById("sim");
      b.hidden = false;
      b.onclick = async () => {
        b.disabled = true;
        try { await fetch(`/api/dev/simulate/${fx.id}`, { method: "POST" }); } finally { setTimeout(() => (b.disabled = false), 1500); }
      };
    } catch {}
  })();
</script>
</body>
</html>
