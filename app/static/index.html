<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f4ef" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<title>Bocina CoDi · Mostrador</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #17161a; --muted: #6d6a73; --line: #e6e2d9;
    --ok: #12945a; --ok-deep: #0d7a49; --sim: #7c3aed; --blue: #1f5eff; --blue-bg: #e9efff; --warn: #b7791f; --warn-bg: #fdf3e1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  button { font: inherit; cursor: pointer; }

  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; z-index: 3; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #bbb; }
  .live.on i { background: var(--ok); box-shadow: 0 0 0 4px rgba(18,148,90,.15); }
  .to-caja { font-size: 13px; color: var(--muted); text-decoration: none; padding: 7px 12px; border-radius: 10px; border: 1px solid transparent; }
  .to-caja:hover { border-color: var(--line); background: var(--card); }
  .embed .to-caja { visibility: hidden; }

  .screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px 110px; text-align: center; }

  /* bocina 3D */
  .device { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; min-height: 0; }
  .device.on { display: flex; }
  .stage { position: relative; flex: 1; width: 100%; max-width: 1100px; min-height: 0; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .stage .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  .views { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .views button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
  .views button:hover { border-color: #d9d4c8; background: #fbfaf7; }
  .views button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .drag-hint { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* log de eventos reales (pagos verificados y conexión) */
  .paylog { margin-top: 12px; width: min(560px, 100%); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    color: var(--muted); text-align: left; min-height: 18px; }
  .paylog .row { display: flex; gap: 10px; padding: 3px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: logIn .35s ease-out; }
  .paylog .row:not(:first-child) { opacity: .62; }
  .paylog .t { color: #a19ea7; flex-shrink: 0; }
  .paylog .ok { color: var(--ok); font-weight: 650; }
  .paylog .sim { color: var(--sim); font-weight: 650; }
  .paylog .warn { color: var(--warn); font-weight: 650; }
  .paylog .muted { overflow: hidden; text-overflow: ellipsis; }
  @keyframes logIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .biz { font-size: clamp(24px, 4vw, 34px); font-weight: 760; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 6px 0 20px; font-size: 16px; }
  .qr { width: min(440px, 78vw, 52vh); background: #fff; padding: 10px; border-radius: 22px; box-shadow: 0 1px 0 var(--line), 0 18px 50px rgba(20,18,25,.08); }
  .qr svg { width: 100%; height: auto; display: block; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; margin-top: 18px; }
  .badge.listen { background: #e7f6ee; color: var(--ok); }
  .badge.listen i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse-dot 1.6s infinite; }
  @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(18,148,90,.5); } 70% { box-shadow: 0 0 0 7px rgba(18,148,90,0); } 100% { box-shadow: 0 0 0 0 rgba(18,148,90,0); } }
  @keyframes blink { 50% { opacity: .25; } }
  .badge.wait { background: var(--warn-bg); color: var(--warn); }
  .badge.wait i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.bad { background: #fdecea; color: #c4352b; }
  .badge.bad i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .spinner { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .to-pay { font-size: clamp(34px, 6vw, 52px); font-weight: 800; letter-spacing: -.02em; }
  .x { margin-top: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 12px; padding: 8px 14px; font-size: 14px; }

  /* momento del pago */

  /* burbuja del asistente */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 0 20px 26px; z-index: 6; pointer-events: none; }
  .bubble { max-width: 520px; margin-bottom: 14px; pointer-events: auto; }
  .bubble .you { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .bubble .pey { background: var(--card); border: 1px solid var(--line); padding: 12px 16px; border-radius: 16px; font-size: 16px; line-height: 1.45; box-shadow: 0 10px 30px rgba(20,18,25,.08); }

  /* último pago y volumen */
  .vol { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); background: rgba(23,22,26,.92); color: #fff; z-index: 8; border-radius: 14px;
    padding: 10px 14px; display: none; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; }
  .vol.show { display: flex; }
  .vol .bars { display: flex; gap: 3px; align-items: flex-end; }
  .vol .bars b { width: 6px; background: #4a4950; border-radius: 2px; }
  .vol .bars b.f { background: #22c55e; }

  .setup input { padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; width: 320px; max-width: 100%; background: #fff; }
  .primary { border: 0; background: var(--ink); color: #fff; border-radius: 14px; padding: 13px 24px; font-size: 16px; font-weight: 650; margin-top: 12px; }

  .sound-hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; background: var(--ink); color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 13px; display: none; }
  .sound-hint.show { display: block; animation: in .2s ease-out; }
  .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 14px; z-index: 20; opacity: 0; transition: .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>


<div class="top">
  <div></div>
  <a class="to-caja" href="/app" id="toApp">Abrir la app →</a>
</div>

<script>
  // Dentro de /demo no hace falta el enlace a la app: está al lado
  if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
</script>
<div class="sound-hint" id="soundHint">🔈 Toca la pantalla una vez para activar el sonido</div>
<div class="screen" id="screen">
  <div id="setup" style="display:none"></div>
  <div class="device" id="device">
    <div class="biz" id="bizTitle"></div>
    <div class="stage" id="stage"><div class="loading" id="stageLoading">Cargando bocina…</div></div>
    <div class="views">
      <button id="viewDefault" class="on">Vista 3D</button>
      <button id="viewQr">Escanear QR</button>
      <button id="viewBack">Ver botones</button>
    </div>
    <div class="badge wait" id="statusBadge"><i></i><span id="statusText">Conectando…</span></div>
    <div class="paylog" id="paylog" aria-live="polite"></div>
    <div class="drag-hint">Arrastra para girar · ↑ ↓ volumen · U último pago</div>
  </div>
</div>

<div class="vol" id="vol"><span id="volIcon">🔊</span><div class="bars" id="volBars"></div><span id="volPct"></span></div>

<div class="dock">
  <div class="bubble" id="bubble"></div>
</div>

<script src="/static/common.js"></script>
<script type="importmap">
{ "imports": {
  "three": "/static/vendor/three/three.module.min.js",
  "three/addons/": "/static/vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/OrbitControls.js";
import { RoomEnvironment } from "three/addons/RoomEnvironment.js";
import { createSoundbox } from "/static/soundbox-display.js";

{
  const { $, money, hhmm, esc, api, toast, Voice } = Bocina;
  let fixed = null;       // QR fijo
  let bubbleTimer = null;

  // ---------- pantalla base: QR fijo o QR con monto ----------
  function renderBase() {
    const setup = $("setup"), device = $("device");
    if (!fixed) {
      device.classList.remove("on");
      setup.style.display = "";
      setup.innerHTML = `
        <div class="setup">
          <div style="font-size:52px">🏪</div>
          <div class="biz" style="margin-top:6px">Crea tu QR fijo</div>
          <div class="sub" style="max-width:360px;margin:8px auto 18px">El cliente lo escanea con su app bancaria, pone el monto y esta pantalla te avisa en voz alta.</div>
          <input id="bizName" placeholder="Nombre del negocio" value="${esc(Bocina.status.businessName || "")}" />
          <div><button class="primary" id="mkFixed">Crear QR fijo</button></div>
        </div>`;
      $("mkFixed").onclick = async () => {
        if (Bocina.status.pinRequired && !Bocina.getPin()) {
          const pin = prompt("PIN del negocio"); if (!pin) return; Bocina.setPin(pin.trim());
        }
        try { fixed = (await api("/api/fixed-qr", { method: "POST", body: JSON.stringify({ name: $("bizName").value.trim() }) })).fixed; renderBase(); }
        catch (e) { if (/PIN/.test(e.message)) Bocina.setPin(""); toast("No se pudo crear: " + e.message, 6000); }
      };
      return;
    }
    setup.style.display = "none"; setup.innerHTML = "";
    device.classList.add("on");
    $("bizTitle").textContent = fixed.name;
    Speaker.show(fixed);
  }

  // ---------- bocina 3D ----------
  const Speaker = (() => {
    let sb = null, renderer, scene, camera, controls, clock, qrLoaded = null, homeDist = 0.34;
    const TARGET = new THREE.Vector3(0, 0.05, 0);
    const HOME_DIR = new THREE.Vector3(0.38, 0.32, 1).normalize();   // 3/4 de frente, un poco desde arriba
    const BACK_DIR = new THREE.Vector3(-0.25, 0.55, -1).normalize(); // lado del comerciante: pantalla y botones
    let tween = null;

    function init() {
      const stage = $("stage");
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      stage.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();
      const key = new THREE.DirectionalLight(0xffffff, 1.6);
      key.position.set(0.35, 0.6, 0.45);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -0.2, right: 0.2, top: 0.2, bottom: -0.2, near: 0.05, far: 2 });
      key.shadow.bias = -0.0004; key.shadow.normalBias = 0.002;
      scene.add(key);
      // el modelo trae su propia sombra de contacto; no agregamos piso con sombra dura

      camera = new THREE.PerspectiveCamera(30, 1, 0.01, 10);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(TARGET);
      controls.enableDamping = true; controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.minDistance = 0.14; controls.maxDistance = 0.7;
      controls.maxPolarAngle = Math.PI * 0.53;   // no ver por debajo del piso
      controls.addEventListener("start", () => setView(null));

      sb = createSoundbox(THREE, { businessName: fixed ? fixed.name : "Mi negocio" });
      scene.add(sb.group);
      sb.enableInteraction(renderer.domElement, camera);
      sb.onButton(onDeviceButton);
      sb.setVolume(Math.round(Bocina.volume() * 10));

      // el módulo detiene el evento en los botones 3D: desbloqueamos el audio antes, en captura
      window.addEventListener("pointerdown", () => Bocina.unlockAudio(), { capture: true });

      new ResizeObserver(resize).observe(stage);
      resize();
      camera.position.copy(TARGET).addScaledVector(HOME_DIR, homeDist);
      camera.lookAt(TARGET);
      clock = new THREE.Clock();
      renderer.setAnimationLoop(frame);
      $("stageLoading").remove();
    }

    function resize() {
      const st = $("stage"), w = st.clientWidth || 1, h = st.clientHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      // distancia para que el aparato (~16 cm con margen) quepa en la vista
      const half = THREE.MathUtils.degToRad(camera.fov / 2);
      homeDist = Math.max(0.17 / 2 / Math.tan(half), 0.19 / 2 / (Math.tan(half) * camera.aspect));
      controls.maxDistance = Math.max(0.7, homeDist * 1.6);
    }

    function frame() {
      const dt = clock.getDelta();
      if (tween) stepTween(dt);
      controls.update();
      sb.setSpeaking(Voice.busy);   // la rejilla late mientras suena la voz
      sb.update(dt);
      renderer.render(scene, camera);
    }

    // vuelo de cámara propio (vista 3D y botones); el QR usa focusQR del módulo
    function flyTo(dir, dist) {
      const startOffset = camera.position.clone().sub(controls.target);
      tween = { t: 0, d: 0.85, startTarget: controls.target.clone(), startOffset, endOffset: dir.clone().multiplyScalar(dist) };
      controls.enabled = false;
    }
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const _q = new THREE.Quaternion(), _qi = new THREE.Quaternion(), _a = new THREE.Vector3(), _b = new THREE.Vector3();
    function stepTween(dt) {
      tween.t += dt;
      const k = ease(Math.min(1, tween.t / tween.d));
      controls.target.lerpVectors(tween.startTarget, TARGET, k);
      _a.copy(tween.startOffset).normalize(); _b.copy(tween.endOffset).normalize();
      _q.setFromUnitVectors(_a, _b); _qi.identity().slerp(_q, k);
      const len = THREE.MathUtils.lerp(tween.startOffset.length(), tween.endOffset.length(), k);
      camera.position.copy(controls.target).add(_a.applyQuaternion(_qi).multiplyScalar(len));
      camera.lookAt(controls.target);
      if (k >= 1) { tween = null; controls.enabled = true; }
    }

    function setView(name) {
      ["viewDefault", "viewQr", "viewBack"].forEach((id) => $(id).classList.toggle("on", id === name));
    }
    function home() { setView("viewDefault"); flyTo(HOME_DIR, homeDist); }
    function back() { setView("viewBack"); flyTo(BACK_DIR, homeDist * 0.95); }
    function scanQr() { tween = null; setView("viewQr"); sb.focusQR(camera, controls, { fill: 0.5 }); }

    function onDeviceButton(name) {
      if (name === "vol-") changeVolume(-0.1);
      else if (name === "vol+") changeVolume(+0.1);
      else if (name === "last") lastPayment();
    }

    return {
      show(f) {
        if (!sb) init();
        sb.setBusinessName(f.name);
        syncStatus();
        if (qrLoaded !== f.qrSvg) {
          qrLoaded = f.qrSvg;
          // el SVG del servidor es "inline" (sin xmlns); como imagen independiente lo necesita
          const svg = /xmlns=/.test(f.qrSvg) ? f.qrSvg : f.qrSvg.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
          sb.setQR(svg).catch((e) => console.error(e));
        }
      },
      press(name) { if (sb) sb.pressButton(name); else onDeviceButton(name); },
      payment(p) { if (sb) sb.showPayment({ amount: p.amount, label: p.simulated ? "Simulación" : p.kind === "amount" ? p.concept : "QR fijo" }); },
      volume(v) { if (sb) sb.setVolume(Math.round(v * 10)); },
      led(state) { if (sb) sb.setLed(state); },
      bump() { if (sb) sb.bump(); },
      status(s) { if (sb) sb.setStatus({ text: s.short, ok: s.ok }); },
      home, back, scanQr,
    };
  })();
  $("viewDefault").onclick = () => Speaker.home();
  $("viewQr").onclick = () => Speaker.scanQr();
  $("viewBack").onclick = () => Speaker.back();

  // ---------- log de eventos reales ----------
  const LOG_MAX = 5;
  function logEvent(kind, text, detail = "") {
    const box = $("paylog"); if (!box) return;
    const t = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    const icon = { ok: "✓", sim: "◆", warn: "●", info: "●" }[kind] || "●";
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="t">${t}</span><span class="${kind === "info" ? "ok" : kind}">${icon} ${esc(text)}</span>${detail ? `<span class="muted">${esc(detail)}</span>` : ""}`;
    box.prepend(row);
    while (box.children.length > LOG_MAX) box.lastChild.remove();
  }
  function logPayment(p) {
    const where = p.kind === "amount" ? p.concept || "Cobro con monto"
      : p.kind === "push" ? `Cobro al celular ···· ${p.phone4 || ""}` : p.kind === "fixed" ? "QR fijo" : "QR externo";
    const tx = p.transactionId ? `tx ${String(p.transactionId).slice(0, 10)}…` : "";
    const mismatch = p.expectedAmount != null && Math.abs(p.expectedAmount - p.amount) > 0.001 ? ` · se cobraron ${money(p.expectedAmount)}` : "";
    if (p.simulated) logEvent("sim", `Simulación · ${money(p.amount)}`, `${where} · no es un pago real`);
    else logEvent("ok", `Pago verificado por pey · ${money(p.amount)}`, `${p.payerBank ? p.payerBank + " · " : ""}${where}${mismatch} · ${tx}`);
  }

  // ---------- estado real: configuración del servidor + conexión en vivo ----------
  let connected = false, wasEverConnected = false;
  function currentStatus() {
    const st = Bocina.status || {};
    if (st.pey === false) return { ok: false, level: "bad", text: "Falta la llave de pey", short: "Falta configurar" };
    if (st.webhookSecret === false) return { ok: false, level: "bad", text: "Falta el secreto del webhook", short: "Falta configurar" };
    if (!connected) return { ok: false, level: "wait", text: "Reconectando con el servidor…", short: "Sin conexión" };
    return { ok: true, level: "listen", text: "Escuchando pagos · CoDi", short: "Escuchando pagos" };
  }
  function syncStatus() {
    const s = currentStatus();
    const b = $("statusBadge");
    b.className = "badge " + s.level;
    $("statusText").textContent = s.text;
    Speaker.status(s);
    syncLed();
  }
  function syncLed() {
    if (!currentStatus().ok) { Speaker.led("error"); return; }
    Speaker.led(Voice.busy ? "talking" : "idle");
  }
  Voice.onChange(() => syncLed());

  // ---------- eventos ----------
  Bocina.connect({
    hello: async () => { await Promise.all([loadFixed(), Bocina.loadStatus()]); renderBase(); syncStatus(); },
    connection: (on) => {
      const was = connected;
      connected = on;
      if ($("statusBadge")) syncStatus();
      if (on && !was) logEvent("info", "Conectado · escuchando pagos", wasEverConnected ? "conexión restablecida" : "");
      if (!on && was) { logEvent("warn", "Sin conexión con el servidor", "reintentando…"); Voice.enqueue({ text: "Sin conexión", gap: 200 }); }
      if (on) wasEverConnected = true;
    },
    payment: (p) => {
      // cada pago entra a la fila; se anuncia completo y en orden
      logPayment(p);   // el log se escribe al llegar (aunque la voz esté en fila)
      Voice.enqueue({ text: p.speech, chime: true, gap: 700, onStart: () => { Speaker.payment(p); Speaker.bump(); } });
    },
    fixed: async () => { await loadFixed(); renderBase(); },
  });
  async function loadFixed() { try { fixed = (await api("/api/fixed-qr")).fixed; } catch {} }

  // ---------- burbuja de texto (último pago) ----------
  function showBubble(you, pey, ms = 7000) {
    clearTimeout(bubbleTimer);
    $("bubble").innerHTML = (you ? `<div class="you">"${esc(you)}"</div>` : "") + (pey ? `<div class="pey">${esc(pey)}</div>` : "");
    if (ms) bubbleTimer = setTimeout(() => { $("bubble").innerHTML = ""; }, ms);
  }
  // ---------- botón: último pago (voz + burbuja, sin tapar el aparato) ----------
  async function lastPayment() {
    try {
      const d = await api("/api/last-payment");
      const p = d.payment;
      const msg = p ? `Último pago: ${money(p.amount)} · ${hhmm(p.paidAt)}${p.simulated ? " · simulación" : ""}` : "Todavía no hay pagos";
      Voice.enqueue({ text: d.speech, gap: 300, onStart: () => showBubble("", msg, 6000) });
    } catch (e) { toast(e.message); }
  }

  // ---------- botones: volumen ----------
  let volTimer = null;
  function showVolume() {
    const n = Math.round(Bocina.volume() * 10);
    $("volBars").innerHTML = Array.from({ length: 10 }, (_, i) => `<b class="${i < n ? "f" : ""}" style="height:${6 + i * 1.6}px"></b>`).join("");
    $("volPct").textContent = n === 0 ? "Silencio" : `${n * 10}%`;
    $("volIcon").textContent = n === 0 ? "🔇" : n < 5 ? "🔉" : "🔊";
    $("vol").classList.add("show"); clearTimeout(volTimer); volTimer = setTimeout(() => $("vol").classList.remove("show"), 1400);
  }
  function changeVolume(delta) { Bocina.setVolume(Bocina.volume() + delta); showVolume(); Speaker.volume(Bocina.volume()); if (!Voice.busy) Bocina.chime(); }

  // teclado: ↑/↓ = volumen, U = último pago (presiona el botón del aparato)
  document.addEventListener("keydown", (e) => {
    if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || e.repeat) return;
    if (e.key === "ArrowUp" || e.key === "+") { e.preventDefault(); Speaker.press("vol+"); }
    else if (e.key === "ArrowDown" || e.key === "-") { e.preventDefault(); Speaker.press("vol-"); }
    else if (e.key.toLowerCase() === "u") { Speaker.press("last"); }
  });

  // ---------- arranque ----------
  Bocina.onSoundChange((ok) => $("soundHint").classList.toggle("show", !ok));
  Bocina.loadStatus().then(renderBase);
}
</script>
</body>
